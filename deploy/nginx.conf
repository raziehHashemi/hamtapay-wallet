# Entry point `app:3000` (the name/port the simulator's PAYOUT_WEBHOOK_URL template expects).
# Load-balances over every `wallet-api` replica; Docker DNS is re-resolved so scaling up/down just works.
worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_x_request_id $request_id_out {
    default $http_x_request_id;
    ''      $request_id;
  }

  log_format main '$remote_addr "$request" $status $request_time rid=$request_id_out upstream=$upstream_addr';
  access_log /dev/stdout main;

  upstream wallet_api {
    zone wallet_api 64k;
    server wallet-api:3000 resolve;
    keepalive 32;
  }

  server {
    listen 3000;
    client_max_body_size 1m;

    location / {
      proxy_pass http://wallet_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id_out;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Never replay a POST on another replica after a timeout (nginx's default already excludes
      # non-idempotent methods; stated explicitly because money endpoints depend on it).
      proxy_next_upstream error;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }
  }
}
